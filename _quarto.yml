project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!CLAUDE.md"
    - "!README.md"
    # Blog hidden from the rendered site since 2026-10-24 (thin + outdated);
    # files stay tracked. To bring it back: drop these two lines + re-add the navbar item.
    - "!blog.qmd"
    - "!blog/**"

freeze: auto

# website settings
website:
  title: "Jan Pfänder"                                # Your name
  image: images/profile.jpg
  
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
    # your sub-pages
    left:
      - text: "Research"
        href: research/index.qmd
      - text: "Teaching"
        href: teaching/index.qmd
      - text: "CV"
        href: cv/index.qmd
        
    # your social media handles
    right:
      - text: "{{< iconify bi github size=1.1em title='GitHub' >}} Github"
        href: https://github.com/janpfander
      - text: "{{< iconify fa6-brands bluesky size=1.1em title='Bluesky' >}} Bluesky"
        href: https://bsky.app/profile/janpfa.bsky.social
      - text: "{{< iconify bi envelope size=1.1em title='E-mail' >}} Email"
        href: "mailto:janlukas.pfaender@gmail.com" 
        
  page-footer: 
    background: light
    left: |
      <span class="faux-block">{{< fa brands creative-commons >}} {{< var years >}} Jan Pfänder</span>
    center: |
      <span class="faux-block">{{< fa brands orcid >}} <strong>ORCID</strong> [{{< var orcid >}}](https://orcid.org/{{< var orcid >}})</span>
    right: |
      <span class="faux-block">Made with {{< fa brands r-project >}} and [Quarto](https://quarto.org/)</span>, 
      <span class="faux-block">[View the source at {{< fa brands github >}} GitHub]({{< var github-url >}})</span>

format:
  html:
    theme: [cosmo, theme.scss]
    css: styles.css
    toc: true
    page-layout: full
    link-external-newwindow: true
    # Only this site's own pages count as internal. Without the filter Quarto uses
    # the host, so links to other janpfander.github.io project sites would stay in-tab.
    link-external-filter: '^https?://janpfander[.]github[.]io/(?:(?:research|cv|teaching)/|index[.]html|[#?]|$)'
    include-after-body: _external_nav_links.html
    #mainfont: monospace

editor: visual

